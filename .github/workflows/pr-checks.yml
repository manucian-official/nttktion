# ╔══════════════════════════════════════════════════════════════════╗
# ║  NexUI — Pull Request Quality Gates                            ║
# ╚══════════════════════════════════════════════════════════════════╝

name: 🔎 PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-title:
    name: 📝 PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          types: [feat, fix, docs, style, refactor, perf, test, chore, revert, ci, build]
          requireScope: false

  size-label:
    name: 🏷️ PR Size Label
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.4
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          sizes: >
            {
              "0": "XS",
              "50": "S",
              "200": "M",
              "500": "L",
              "1000": "XL"
            }

  changeset-check:
    name: 📋 Changeset Required
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-changeset')"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            packages:
              - 'packages/**'
      - uses: changesets/assert-changeset@v1
        if: steps.changes.outputs.packages == 'true'

  diff-summary:
    name: 📊 Bundle Diff Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Comment bundle sizes on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const packages = ['core', 'themes', 'native']
            let rows = ''
            for (const pkg of packages) {
              const distPath = `packages/${pkg}/dist`
              if (fs.existsSync(distPath)) {
                const files = fs.readdirSync(distPath)
                for (const f of files) {
                  const stat = fs.statSync(`${distPath}/${f}`)
                  const kb = (stat.size / 1024).toFixed(1)
                  rows += `| \`@nexui/${pkg}/${f}\` | ${kb} KB |\n`
                }
              }
            }
            const body = `## 📦 Bundle Sizes\n\n| File | Size |\n|------|------|\n${rows || '| — | — |\n'}\n<sub>Generated by bundle-diff-summary</sub>`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
